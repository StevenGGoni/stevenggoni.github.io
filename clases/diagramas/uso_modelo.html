<title>Uso del modelo</title>
<style>
    :root {
        --bg: #F1F5F5;
        --text-muted: #556070;
        --accent: #C18A00;
    }

    * { box-sizing: border-box; }

    html, body {
        height: 100%;
        background-color: var(--bg) !important;
    }

    body {
        margin: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: var(--bg);
        font-family: 'Aller', system-ui, -apple-system, sans-serif;
        padding: 30px 40px 20px;
        overflow: hidden;
    }

    .diagram-wrap {
        width: 100%;
        max-width: 1900px;
        flex: 1;
        min-height: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .diagram-wrap svg {
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }

    svg text {
        font-family: 'Aller-Bold', 'Aller', system-ui, sans-serif !important;
    }

    .footer-info {
        width: 100%;
        max-width: 1900px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 24px;
        margin-top: 12px;
        padding: 0 10px;
        flex-shrink: 0;
    }

    .enlace-full, .footnote {
        font-size: 18px;
        color: var(--text-muted);
        opacity: 0.9;
    }

    .enlace-full a {
        color: var(--accent);
        font-weight: bold;
        text-decoration: none;
        border-bottom: 1px solid rgba(193, 138, 0, 0.3);
        transition: all 0.3s ease;
    }

    .enlace-full a:hover {
        border-bottom: 1px solid var(--accent);
        opacity: 1;
    }

    .footnote {
        font-style: italic;
        text-align: right;
        white-space: nowrap;
    }
</style>
</head>
